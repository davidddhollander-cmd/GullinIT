[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
export_filter="all_resources"
include_filter="data/*.json,data/levels/*.json"
exclude_filter="tests/*,tools/*,test-output/*,docs/*,assets/previews/*,assets/reference/*,assets/lab/*,assets/archive/*,scenes/art_lab.tscn,scripts/art_lab.gd,data/art_lab.json"
export_path="build/windows/GullinIt.exe"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/product_name="Gullin' It"

[preset.1]
name="Web"
platform="Web"
export_filter="all_resources"
include_filter="data/*.json,data/levels/*.json"
exclude_filter="tests/*,tools/*,test-output/*,docs/*,assets/previews/*,assets/reference/*,assets/lab/*,assets/archive/*,scenes/art_lab.tscn,scripts/art_lab.gd,data/art_lab.json"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<style>canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;-webkit-touch-callout:none}</style><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/orientation=1
progressive_web_app/display=1
